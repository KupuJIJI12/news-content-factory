  <h1>Ремонт дороги на улице Гагарина продлится до пятницы</h1>
  <div class="field field--name-body">
    <p>Подрядчик меняет асфальт на участке от школы до рынка. Движение там ограничено, автобусы идут в объезд по улице Победы.</p>
    <p><img src="/sites/default/files/inline-images/doroga.jpg" alt="Дорога"></p>
    <p>Работы должны закончить к пятнице, если не помешает погода. После этого нанесут разметку и вернут остановки.</p>
